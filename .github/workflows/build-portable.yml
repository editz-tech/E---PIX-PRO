name: Build E-PIX PRO portable version
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "E-Pix.spec"
      - "requirements.txt"
      - "scripts/**"
      - ".github/workflows/build-portable.yml"
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Download offline AI model
        run: python scripts/download_model.py
      - name: Build portable application folder
        run: pyinstaller --noconfirm --clean "E-Pix.spec"
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\E-PIX PRO" -DestinationPath "E-PIX-PRO-Portable.zip" -CompressionLevel Optimal
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: E-PIX-PRO-Portable-Windows
          path: E-PIX-PRO-Portable.zip
          if-no-files-found: error
          retention-days: 30
