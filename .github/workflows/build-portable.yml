# Unsigned portable release: no code-signing certificate is required.
name: Build E-PIX PRO portable version

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "portrait_alignment.py"
      - "shadow_matte.py"
      - "ai_portrait.py"
      - "E-Pix.spec"
      - "requirements.txt"
      - "scripts/**"
      - "README.md"
      - "BUILD-PORTABLE.ps1"
      - "BUILD-PORTABLE.bat"
      - ".github/workflows/build-portable.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "portrait_alignment.py"
      - "shadow_matte.py"
      - "ai_portrait.py"
      - "E-Pix.spec"
      - "requirements.txt"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/build-portable.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download offline AI model
        run: python scripts/download_model.py

      - name: Confirm source AI model before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceModel = Join-Path $PWD "models\u2net.onnx"
          if (-not (Test-Path $sourceModel -PathType Leaf)) {
            throw "Model download step did not create $sourceModel"
          }
          $model = Get-Item $sourceModel
          if ($model.Length -lt 50000000) {
            throw "U2Net model is unexpectedly small ($($model.Length) bytes)."
          }
          Write-Host "Source model verified: $($model.Length) bytes"

      - name: Build portable application folder
        run: pyinstaller --noconfirm --clean "E-Pix.spec"

      # Optional Authenticode signing. Add the PFX certificate and password as
      # repository Actions secrets when a trusted code-signing certificate is purchased.
      - name: Sign Windows executable when a certificate is configured
        shell: pwsh
        env:
          EPIX_SIGNING_CERT_BASE64: ${{ secrets.EPIX_SIGNING_CERT_BASE64 }}
          EPIX_SIGNING_CERT_PASSWORD: ${{ secrets.EPIX_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:EPIX_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:EPIX_SIGNING_CERT_PASSWORD)) {
            Write-Warning "No code-signing certificate is configured. This build will remain unsigned; browser/SmartScreen reputation warnings may still appear."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "epix-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:EPIX_SIGNING_CERT_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found on the build runner." }

            $exePath = Join-Path $PWD "dist\E-PIX PRO\E-PIX PRO.exe"
            & $signtool sign /fd SHA256 /f $pfxPath /p $env:EPIX_SIGNING_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $exePath
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE." }
            & $signtool verify /pa /v $exePath
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed." }
            Write-Host "The E-PIX PRO executable was signed and its Authenticode signature verified."
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:EPIX_SIGNING_CERT_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:EPIX_SIGNING_CERT_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Validate application payload and create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appPath = Join-Path $PWD "dist\E-PIX PRO"
          $exePath = Join-Path $appPath "E-PIX PRO.exe"
          # PyInstaller 6 places bundled data under _internal by default.
          $modelPath = Join-Path $appPath "_internal\models\u2net.onnx"

          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Expected application executable is missing: $exePath"
          }
          if (-not (Test-Path $modelPath -PathType Leaf)) {
            $found = @(Get-ChildItem -Path $appPath -Filter "u2net.onnx" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
            throw "Bundled model is missing from PyInstaller's _internal\models folder. Found model files: $($found -join '; ')"
          }
          if ((Get-Item $modelPath).Length -lt 50000000) {
            throw "Bundled U2Net model is unexpectedly small."
          }

          @"
          E-PIX PRO portable build
          This application is not digitally signed.
          Windows SmartScreen or browser download protection may show an unknown-publisher or reputation warning.
          Do not disable security protection to run this file.
          Verify the ZIP SHA-256 using SHA256SUMS.txt supplied beside the ZIP in the GitHub Actions artifact.
          Build commit: $env:GITHUB_SHA
          "@ | Set-Content (Join-Path $appPath "DOWNLOAD-INFO.txt") -Encoding UTF8

          if (Test-Path "E-PIX-PRO-Portable.zip") {
            Remove-Item "E-PIX-PRO-Portable.zip" -Force
          }
          Compress-Archive -Path $appPath -DestinationPath "E-PIX-PRO-Portable.zip" -CompressionLevel Optimal

          $verifyDir = Join-Path $env:RUNNER_TEMP "epix-zip-verify"
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          Expand-Archive -LiteralPath "E-PIX-PRO-Portable.zip" -DestinationPath $verifyDir -Force
          if (-not (Test-Path (Join-Path $verifyDir "E-PIX PRO\E-PIX PRO.exe"))) {
            throw "The portable ZIP does not contain the expected EXE."
          }
          if (-not (Test-Path (Join-Path $verifyDir "E-PIX PRO\_internal\models\u2net.onnx"))) {
            throw "The portable ZIP does not contain the offline AI model in PyInstaller's _internal folder."
          }

      - name: Scan build folder and ZIP with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) {
            throw "Microsoft Defender scan cmdlets are unavailable on this runner. Refusing to publish an unscanned build."
          }

          Update-MpSignature -ErrorAction Stop
          $scanStarted = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD "dist\E-PIX PRO") -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD "E-PIX-PRO-Portable.zip") -ErrorAction Stop

          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.InitialDetectionTime -ge $scanStarted
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List ThreatName, ThreatID, InitialDetectionTime, Resources
            throw "Microsoft Defender reported a threat in this build. Artifact publication stopped."
          }
          Write-Host "Microsoft Defender completed scans with no new detections."

      - name: Create SHA-256 checksums and build manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipHash = (Get-FileHash "E-PIX-PRO-Portable.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "dist\E-PIX PRO\E-PIX PRO.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  E-PIX-PRO-Portable.zip" | Set-Content "SHA256SUMS.txt" -Encoding ASCII

          $signature = Get-AuthenticodeSignature "dist\E-PIX PRO\E-PIX PRO.exe"
          $manifest = [ordered]@{
            product = "E-PIX PRO"
            artifact = "E-PIX-PRO-Portable.zip"
            source_commit = $env:GITHUB_SHA
            workflow_run = $env:GITHUB_RUN_ID
            built_utc = (Get-Date).ToUniversalTime().ToString("o")
            runtime = "Windows x64"
            python = (python --version 2>&1 | Out-String).Trim()
            zip_sha256 = $zipHash
            executable_sha256 = $exeHash
            authenticode_status = [string]$signature.Status
            digitally_signed = ($signature.Status -eq "Valid")
            malware_scan = "Microsoft Defender scan completed; no new detections reported"
            note = "A clean Defender scan and matching checksum do not guarantee that Chrome Safe Browsing or SmartScreen will trust an unsigned application."
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "BUILD-MANIFEST.json" -Encoding UTF8
          Get-Content "SHA256SUMS.txt"
          Get-Content "BUILD-MANIFEST.json"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: E-PIX-PRO-Portable.zip

      - name: Upload verified portable package and verification files
        uses: actions/upload-artifact@v4
        with:
          name: E-PIX-PRO-Portable-Windows
          path: |
            E-PIX-PRO-Portable.zip
            SHA256SUMS.txt
            BUILD-MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
