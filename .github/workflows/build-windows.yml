name: Build E-PIX PRO Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Download offline AI model
        run: python scripts/download_model.py
      - name: Build application
        run: pyinstaller --noconfirm --clean "E-Pix.spec"
      - name: Create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          @'
          [Setup]
          AppId={{8F0C73D4-7B90-4B14-8B0A-1E0A9E1C2026}
          AppName=E-PIX PRO
          AppVersion=0.1.0
          DefaultDirName={autopf}\E-PIX PRO
          DefaultGroupName=E-PIX PRO
          OutputDir=installer
          OutputBaseFilename=E-PIX-PRO-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          [Files]
          Source: "dist\E-PIX PRO\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\E-PIX PRO"; Filename: "{app}\E-PIX PRO.exe"
          Name: "{autodesktop}\E-PIX PRO"; Filename: "{app}\E-PIX PRO.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          [Run]
          Filename: "{app}\E-PIX PRO.exe"; Description: "Launch E-PIX PRO"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer\setup.iss
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: E-PIX-PRO-Windows-Installer
          path: installer/E-PIX-PRO-Setup.exe
          if-no-files-found: error
